name: Deploy Docs to VPS

on:
  # Trigger after CI passes on master — avoids the workflow_call concurrency
  # deadlock that occurs when both ci.yml and docs-deploy.yml share the same
  # concurrency group.
  workflow_run:
    workflows: ["CI"]
    branches:  [master]
    types:     [completed]
  # Allow manual redeploy from the Actions tab
  workflow_dispatch:

concurrency:
  group:              docs-deploy-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest

    # Skip if CI failed (only relevant for workflow_run trigger)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v6
        with:
          # Use the commit that triggered the CI run (not necessarily HEAD)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # ── Check whether docs files actually changed ─────────────────────────
      - name: Check for docs changes
        id: docs-changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin master --depth=2
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- apps/docs/ .github/workflows/docs-deploy.yml || true)
          if [ -n "$CHANGED" ]; then
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Install & build (only if docs changed) ───────────────────────────
      - uses: pnpm/action-setup@v4
        if: steps.docs-changed.outputs.changed == 'true'

      - uses: actions/setup-node@v6
        if: steps.docs-changed.outputs.changed == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: steps.docs-changed.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build docs
        if: steps.docs-changed.outputs.changed == 'true'
        # @forgeportal/docs-site is the Docusaurus app in apps/docs/ that
        # produces apps/docs/build/ — not packages/docs (the backend indexer).
        # Turbo respects ^build so any workspace deps are compiled first.
        run: pnpm turbo build --filter=@forgeportal/docs-site

      # ── Deploy ────────────────────────────────────────────────────────────
      - name: Deploy to VPS via rsync
        if: steps.docs-changed.outputs.changed == 'true'
        uses: burnett01/rsync-deployments@8.0.5
        with:
          switches:    -avz --delete --exclude='__server'
          path:        apps/docs/build/
          remote_path: /var/www/forgeportal-docs/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_port: 22
          remote_user: root
          remote_key:  ${{ secrets.VPS_SSH_KEY }}

      - name: Fix permissions on VPS
        if: steps.docs-changed.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: root
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     22
          script: |
            chown -R www-data:www-data /var/www/forgeportal-docs
            chmod -R 755 /var/www/forgeportal-docs
            echo "Deploy OK: $(date)"

      - name: Skip notice
        if: steps.docs-changed.outputs.changed != 'true'
        run: echo "No docs files changed — skipping deploy."
