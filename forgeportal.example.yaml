# ForgePortal Configuration
# Copy to forgeportal.yaml and customize.
# All values shown are defaults.
# Env vars override: FORGEPORTAL_<SECTION>__<KEY>=value (double underscore for nesting)
# Legacy env vars (DB_HOST, PORT, etc.) also work for backward compatibility.

db:
  host: localhost
  port: 5432
  database: forgeportal
  user: forge
  password: forge_local_dev  # Use K8s Secret or Docker secret in production!
  maxPoolSize: 20

server:
  port: 4000
  host: 0.0.0.0
  logLevel: info  # debug | info | warn | error

auth:
  oidc:
    # issuer: https://keycloak.example.com/realms/forgeportal
    # clientId: forgeportal
    # clientSecret: <from-secret>
  sessionSecret: change-me-forgeportal-session-secret  # min 16 chars

scm:
  github:
    # Mode 1: GitHub App (recommended)
    # appId: "12345"
    # privateKeyPath: /secrets/github-app.pem
    # Mode 2: PAT fallback
    # token: ghp_xxxx
    # webhookSecret: <from-secret>
  gitlab:
    # token: <from-secret>
    baseUrl: https://gitlab.com
    # webhookSecret: <from-secret>

discovery:
  # Organisations or personal accounts to scan for entity.yaml files.
  # Each repo that contains a file at entityFilePath will be catalogued.
  # For personal accounts, use your GitHub username — the provider will
  # auto-detect user vs. org and use the correct API endpoint automatically.
  orgs: []
  # - provider: github
  #   org: my-github-org           # GitHub organisation slug
  #   topic: forgeportal           # optional: only repos with this topic
  # - provider: github
  #   org: my-github-username      # personal account — auto-detected as user
  # - provider: gitlab
  #   org: my-gitlab-group         # GitLab group path (e.g. "acmecorp/platform")
  entityFilePath: entity.yaml      # path to entity descriptor in each repo
  intervalMinutes: 0               # 0 = manual only, >0 = periodic scan (minutes)
  # Tip: set via env var for CI/CD without a YAML file:
  #   FORGEPORTAL_DISCOVERY__ORGS='[{"provider":"github","org":"my-org"}]'

migrations:
  dir: tools/migration
  runSeed: false
  seedFile: tools/seed/seed_v1.sql

pluginPackages:
  packages: []
    # List npm packages to load as plugins at startup.
    # Each must have a valid forgeportal-plugin.json manifest.
    # - "@myorg/forge-plugin-pagerduty"
    # - "@myorg/forge-plugin-costview"

plugins: {}
  # Per-plugin runtime configuration (enabled flag + non-secret config).
  # Key = plugin ID (package name without scope and "forge-plugin-" prefix).
  # example-plugin:
  #   enabled: true
  #   config:
  #     apiEndpoint: https://api.example.com
  #     # apiKey: set via FORGEPORTAL_PLUGIN_EXAMPLEPLUGIN_APIKEY

encryptionKey: local-dev-key-change-in-prod-32chars!  # min 16 chars
