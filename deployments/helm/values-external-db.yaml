# Example: deploy ForgePortal with an external PostgreSQL database.
# Use with: helm install forgeportal ./deployments/helm -f deployments/helm/values-external-db.yaml
#
# Prerequisites:
# - Create a Kubernetes Secret containing your DB password (key: db-password).
# - Set externalDatabase.existingSecret to that secret's name.

nameOverride: ""
fullnameOverride: ""

# Disable in-cluster Postgres
postgres:
  enabled: false

externalDatabase:
  enabled: true
  host: "my-postgres.example.svc.cluster.local"   # or external host
  port: 5432
  database: forgeportal
  username: forge
  existingSecret: "forgeportal-db-credentials"    # Secret with key "db-password"

# Application secrets (OIDC, encryption, etc.) — use your own Secret
secrets:
  createDefaultSecret: false
  existingSecret: "forgeportal-app-secrets"       # keys: oidc-client-secret, encryption-key, session-secret, etc.

