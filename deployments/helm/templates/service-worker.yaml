apiVersion: v1
kind: Service
metadata:
  name: {{ include "forgeportal.fullname" . }}-worker
  labels:
    {{- include "forgeportal.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: {{ include "forgeportal.name" . }}
    app.kubernetes.io/component: worker
