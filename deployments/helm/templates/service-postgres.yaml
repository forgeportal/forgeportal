{{- if and .Values.postgres.enabled (not .Values.externalDatabase.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "forgeportal.fullname" . }}-postgres
  labels:
    {{- include "forgeportal.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: {{ include "forgeportal.name" . }}
    app.kubernetes.io/component: postgres
{{- end }}
