apiVersion: v1
kind: Service
metadata:
  name: {{ include "forgeportal.fullname" . }}-api
  labels:
    {{- include "forgeportal.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "forgeportal.name" . }}
    app.kubernetes.io/component: api
